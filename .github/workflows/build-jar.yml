name: Build Jar - Maven (artifact)

on:
  push:
    branches: [ "feature/variablemanage-hook" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure required local libs exist (gui / EconomyAPI optional)
        run: |
          set -e
          # 如果你有这些本地 system-scope 依赖，建议把它们上传到 libs/
          MISSING=0
          for f in libs/gui-v1.15.1.jar libs/EconomyAPI.jar; do
            if [ ! -f "$f" ]; then
              echo "WARN: Missing optional local lib: $f (OK if you don't use system-scope deps)"
            fi
          done
          # Nukkit.jar 可选：若存在则直接安装到本地 m2（提高稳定性）
          if [ -f libs/Nukkit.jar ]; then
            echo "Found libs/Nukkit.jar, will install to local maven repo"
          else
            echo "No libs/Nukkit.jar found - workflow will try to clone and build MemoriesOfTime/Nukkit-MOT"
          fi

      - name: Prepare Nukkit dependency (install to local m2)
        run: |
          set -e
          if [ -f libs/Nukkit.jar ]; then
            mvn org.apache.maven.plugins:maven-install-plugin:3.1.0:install-file \
              -Dfile=libs/Nukkit.jar \
              -DgroupId=cn.nukkit \
              -DartifactId=Nukkit \
              -Dversion=MOT-SNAPSHOT \
              -Dpackaging=jar
          else
            echo "Cloning MemoriesOfTime/Nukkit-MOT and running mvn install (may take some time)"
            git clone --depth=1 https://github.com/MemoriesOfTime/Nukkit-MOT.git /tmp/Nukkit-MOT || (echo "Clone failed"; exit 1)
            cd /tmp/Nukkit-MOT
            mvn -B -DskipTests install || (echo "Nukkit-MOT build failed; consider uploading compiled Nukkit.jar to libs/"; exit 1)
          fi

      - name: Build the plugin with Maven
        run: |
          set -e
          mvn -B -DskipTests package

      - name: Show build output (for debugging)
        run: |
          echo "==== target/ listing ===="
          ls -la target || true
          echo "==== end listing ===="

      - name: Find produced jar
        id: find_artifact
        run: |
          set -e
          # 找到第一个 jar（如果你需要特定名称，请替换下面 pattern）
          ARTIFACT=$(ls target/*.jar 2>/dev/null | head -n 1 || true)
          if [ -z "$ARTIFACT" ]; then
            echo "No jar found in target/ — build likely failed or artifact name differs."
            ls -la target || true
            exit 1
          fi
          echo "Found artifact: $ARTIFACT"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "artifact_name=$(basename "$ARTIFACT")" >> $GITHUB_OUTPUT

      - name: Upload build artifact for manual download
        uses: actions/upload-artifact@v4
        with:
          name: rysmenux-${{ github.sha }}
          path: ${{ steps.find_artifact.outputs.artifact }}
