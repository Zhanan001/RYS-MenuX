name: Release Jar - Maven

on: push: branches: [ "feature/variablemanage-hook" ] workflow_dispatch:

jobs: build-and-release: runs-on: ubuntu-latest

steps:
- name: Checkout repository
  uses: actions/checkout@v4

- name: Set up JDK 17
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: 17

- name: Build with Maven
  run: mvn -B -DskipTests package

- name: Create Release
  id: create_release
  uses: actions/create-release@v1
  with:
    tag_name: rysmenux-${{ github.sha }}
    release_name: RYSMenuX-${{ github.sha }}
    body: Automated release from workflow
    draft: false
    prerelease: false
    token: ${{ secrets.GITHUB_TOKEN }}

- name: Upload Release Asset
  uses: actions/upload-release-asset@v1
  with:
    upload_url: ${{ steps.create_release.outputs.upload_url }}
    asset_path: target/*.jar
    asset_name: rysmenux-${{ github.sha }}.jar
    asset_content_type: application/java-archive
