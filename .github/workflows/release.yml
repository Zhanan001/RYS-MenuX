name: Release Jar - Maven

on:
  push:
    branches: [ "feature/variablemanage-hook" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Nukkit dependency (use libs/Nukkit.jar if present or build from MemoriesOfTime/Nukkit-MOT)
        run: |
          set -e
          if [ -f libs/Nukkit.jar ]; then
            echo "Using provided libs/Nukkit.jar"
            mvn org.apache.maven.plugins:maven-install-plugin:3.1.0:install-file \
              -Dfile=libs/Nukkit.jar \
              -DgroupId=cn.nukkit \
              -DartifactId=Nukkit \
              -Dversion=MOT-SNAPSHOT \
              -Dpackaging=jar
          else
            echo "No libs/Nukkit.jar found, cloning and building Nukkit-MOT..."
            git clone https://github.com/MemoriesOfTime/Nukkit-MOT.git /tmp/Nukkit-MOT
            cd /tmp/Nukkit-MOT
            mvn -B -DskipTests package
            JAR=$(find target -maxdepth 1 -type f -name '*.jar' | head -n 1)
            if [ -z "$JAR" ]; then
              echo "ERROR: Nukkit build produced no jar"
              exit 1
            fi
            echo "Installing $JAR to local maven repository"
            mvn org.apache.maven.plugins:maven-install-plugin:3.1.0:install-file \
              -Dfile="$JAR" \
              -DgroupId=cn.nukkit \
              -DartifactId=Nukkit \
              -Dversion=MOT-SNAPSHOT \
              -Dpackaging=jar
          fi

      - name: Build the plugin with Maven
        run: mvn -B -DskipTests package

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: rysmenux-${{ github.sha }}
          release_name: RYSMenuX-${{ github.sha }}
          body: Automated release from workflow
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Artifact
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/*.jar
          asset_name: rysmenux-${{ github.sha }}.jar
          asset_content_type: application/java-archive
